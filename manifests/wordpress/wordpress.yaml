# WordPress and MariaDB on Cinder volumes.
#
# Deploy it on its own:
#   kubectl apply -f manifests/wordpress/wordpress.yaml
#   kubectl -n wordpress port-forward svc/wordpress 8080:80
#
# Both workloads use a ReadWriteOnce volume and a single replica, so their
# strategy is Recreate. Raising the replica count requires ReadWriteMany storage
# for wp-content, which csi-cinder-sc-delete does not provide.
#
# Only wp-content is stored on the PVC. Core WordPress comes from the image, so
# changing the image tag upgrades the site; keeping core on the volume would
# freeze it at whichever version first filled an empty directory.
#
# The passwords in the Secret are placeholders. Replace them before exposing the
# site, and keep them out of git if this ever runs outside a lab.
apiVersion: v1
kind: Namespace
metadata:
  name: wordpress
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress
  namespace: wordpress
type: Opaque
stringData:
  mariadb-root-password: changeme-root
  mariadb-password: changeme
  wordpress-password: changeme
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-mariadb
  namespace: wordpress
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: csi-cinder-sc-delete
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-wp-content
  namespace: wordpress
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: csi-cinder-sc-delete
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-mariadb
  namespace: wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress-mariadb
  template:
    metadata:
      labels:
        app: wordpress-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8.9
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress
                  key: mariadb-root-password
            - name: MARIADB_DATABASE
              value: wordpress
            - name: MARIADB_USER
              value: wordpress
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress
                  key: mariadb-password
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wordpress-mariadb
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-mariadb
  namespace: wordpress
spec:
  selector:
    app: wordpress-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          # Moving tag: points at the newest stable Apache image. Pin a version
          # (for example 7.1.5-apache) if you need reproducible redeploys.
          image: wordpress:latest
          env:
            - name: WORDPRESS_DB_HOST
              value: wordpress-mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress
                  key: wordpress-password
            # TLS ends at the Gateway, so WordPress sees plain HTTP from the
            # proxy. Tell it the public scheme so it does not emit http:// links.
            - name: WORDPRESS_CONFIG_EXTRA
              value: |-
                if ( isset( $_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
                  $_SERVER['HTTPS'] = 'on';
                }
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            # Only wp-content is persistent. Core files come from the image, so
            # a new :latest tag actually upgrades WordPress on the next rollout.
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wordpress-wp-content
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
spec:
  selector:
    app: wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Exposed through the shared `public` Gateway in monitoring, whose
# wordpress-http/wordpress-https listeners accept routes from this namespace.
# TLS terminates at the Gateway; see manifests/observability/gateway.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wordpress
  namespace: wordpress
spec:
  parentRefs:
    - name: public
      namespace: monitoring
      sectionName: wordpress-https
  hostnames:
    - wordpress.local.my.id
  rules:
    - backendRefs:
        - name: wordpress
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wordpress-redirect
  namespace: wordpress
spec:
  parentRefs:
    - name: public
      namespace: monitoring
      sectionName: wordpress-http
  hostnames:
    - wordpress.local.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
