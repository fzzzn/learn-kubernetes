# Rancher server, exposed through the shared `public` Gateway in monitoring.
# The rancher-http/rancher-https listeners accept routes from this namespace.
#
# TLS terminates at the Gateway, so the chart runs with tls=external and
# networkExposure.type=none: it creates no Ingress and no certificate of its own.
# Cilium sets X-Forwarded-Proto, which Rancher reads; without it the backend
# answers 302 to https:// on every request and the UI never loads.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rancher
  namespace: cattle-system
spec:
  parentRefs:
    - name: public
      namespace: monitoring
      sectionName: rancher-https
  hostnames:
    - rancher.local.my.id
  rules:
    - backendRefs:
        - name: rancher
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rancher-redirect
  namespace: cattle-system
spec:
  parentRefs:
    - name: public
      namespace: monitoring
      sectionName: rancher-http
  hostnames:
    - rancher.local.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
