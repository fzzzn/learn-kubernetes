# Grafana, Prometheus, node-exporter, kube-state-metrics.
# Chart: prometheus-community/kube-prometheus-stack
grafana:
  # Lab default. Change it before exposing Grafana outside the cluster.
  adminPassword: changeme
  # Peak measured in this cluster was 558Mi (dashboard rendering). The limit is
  # ~1.4x that so a heavy dashboard cannot take down the node.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
  # Two k8s-sidecar containers (dashboards and datasources) run per Grafana pod,
  # ~80Mi each, and the chart sets no limit on them by default.
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  grafana.ini:
    server:
      # Matches the Gateway hostname; used for links in alerts and emails.
      root_url: https://grafana.local.my.id
  # Users, API keys, and dashboard edits live on a Cinder volume, so they
  # survive pod restarts. adminPassword above only seeds an empty database.
  persistence:
    enabled: true
    storageClassName: csi-cinder-sc-delete
    size: 1Gi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        maxLines: 1000

# kube-proxy is absent when kube_proxy_replacement = true, so its ServiceMonitor
# and KubeProxyDown rule could only ever fire.
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    # Peak was 761Mi with 7 days of retention. 2Gi leaves room for compaction and
    # a bigger scrape target count without OOMKilling the WAL.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: csi-cinder-sc-delete
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    # Small on purpose: two replicas are not worth it on one control plane.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 192Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 128Mi
