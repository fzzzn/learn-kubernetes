# Grafana, Prometheus, node-exporter, kube-state-metrics.
# Chart: prometheus-community/kube-prometheus-stack
grafana:
  # Lab default. Change it before exposing Grafana outside the cluster.
  adminPassword: changeme
  grafana.ini:
    server:
      # Matches the Gateway hostname; used for links in alerts and emails.
      root_url: https://grafana.local.my.id
  # Users, API keys, and dashboard edits live on a Cinder volume, so they
  # survive pod restarts. adminPassword above only seeds an empty database.
  persistence:
    enabled: true
    storageClassName: csi-cinder-sc-delete
    size: 1Gi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      jsonData:
        maxLines: 1000

# kube-proxy is absent when kube_proxy_replacement = true, so its ServiceMonitor
# and KubeProxyDown rule could only ever fire.
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: csi-cinder-sc-delete
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
