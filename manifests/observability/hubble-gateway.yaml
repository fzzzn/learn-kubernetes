# Publishes Hubble UI on https://hubble.local.my.id through Cilium Gateway API.
# Cilium creates its own LoadBalancer Service, so this hostname gets a separate
# Octavia load balancer and floating IP from the Grafana one.
#
# The HTTP-01 solver is bound to a single Gateway, which is why this file has
# its own ClusterIssuer. Keep the ACME email in sync with grafana-gateway.yaml.
#
# Hubble UI has no authentication: anyone who can reach this hostname can see
# pod-to-pod flows and DNS queries for the whole cluster.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-hubble
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@local.my.id
    privateKeySecretRef:
      name: letsencrypt-prod-hubble
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: hubble
                namespace: kube-system
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hubble-tls
  namespace: kube-system
spec:
  secretName: hubble-tls
  dnsNames:
    - hubble.local.my.id
  issuerRef:
    name: letsencrypt-prod-hubble
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hubble
  namespace: kube-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: hubble.local.my.id
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: hubble.local.my.id
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hubble-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: kube-system
spec:
  parentRefs:
    - name: hubble
      sectionName: https
  hostnames:
    - hubble.local.my.id
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-redirect
  namespace: kube-system
spec:
  parentRefs:
    - name: hubble
      sectionName: http
  hostnames:
    - hubble.local.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
