# Single-binary Loki on a Cinder volume.
# Chart: grafana/loki
deploymentMode: SingleBinary

loki:
  # Single tenant: no X-Scope-OrgID header needed from Alloy or Grafana.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: csi-cinder-sc-delete
    size: 10Gi

# Not used in single-binary mode.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Memcached caches are optional; keep them off on a small cluster.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Ship the chart's official Loki dashboards and their recording rules to
# Grafana and Prometheus.
monitoring:
  dashboards:
    enabled: true
  rules:
    enabled: true
    labels:
      release: kube-prometheus-stack
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
