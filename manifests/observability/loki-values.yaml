# Single-binary Loki on a Cinder volume.
# Chart: grafana/loki
deploymentMode: SingleBinary

loki:
  # Single tenant: no X-Scope-OrgID header needed from Alloy or Grafana.
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  # Peak was 264Mi. Single-binary Loki buffers writes in memory before flushing.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: csi-cinder-sc-delete
    size: 10Gi

# Not used in single-binary mode.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Memcached caches are optional; keep them off on a small cluster.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  # Only fronts the Loki push/query API inside the cluster; the chart sets no
  # resources on it.
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

# The canary writes a log line per interval and queries it back, so a stale
# canary means writes are failing. It runs one pod per node by default; the
# chart sets no resources.
lokiCanary:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

# Ship the chart's official Loki dashboards and their recording rules to
# Grafana and Prometheus.
monitoring:
  dashboards:
    enabled: true
  rules:
    enabled: true
    labels:
      release: kube-prometheus-stack
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
