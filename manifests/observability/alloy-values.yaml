# Ships pod logs to Loki. Runs as a DaemonSet, one pod per node.
# Chart: grafana/alloy
alloy:
  # Peak was 236Mi on the busiest node. Alloy reads every container log on its
  # node, so the limit scales with log volume rather than with traffic.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 384Mi
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

# Prometheus scrapes Alloy's own /metrics through this ServiceMonitor.
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
