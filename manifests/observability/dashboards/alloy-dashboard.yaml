apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  alloy.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Alloy pods up",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            { "refId": "A", "expr": "sum(up{namespace=\"monitoring\", pod=~\"alloy-.*\"})" }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Entries sent/s",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(loki_write_sent_entries_total[5m]))" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Entries dropped/s",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(loki_write_dropped_entries_total[5m]))" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Bytes sent/s",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum(rate(loki_write_sent_bytes_total[5m]))" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU per pod",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(process_cpu_seconds_total{namespace=\"monitoring\", pod=~\"alloy-.*\"}[5m]))"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory per pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (process_resident_memory_bytes{namespace=\"monitoring\", pod=~\"alloy-.*\"})"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["alloy", "loki"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "Alloy",
      "uid": "alloy",
      "version": 1
    }
