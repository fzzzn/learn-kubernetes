# Publishes Grafana, the Hubble UI, and WordPress through one Cilium Gateway, so
# all three hostnames share a single Octavia load balancer and floating IP.
# Cilium creates the LoadBalancer Service; the CCM turns it into an Octavia load
# balancer.
#
# Requires Cilium kube-proxy replacement, the Gateway API CRDs,
# gatewayAPI.enabled=true, and cert-manager config.gatewayAPI.enabled=true.
# See docs/tls.md.
#
# One Certificate covers Grafana and Hubble because HTTP-01 through the Gateway
# can only reference a single parent Gateway. Renewal fails for both names if
# either A record is missing. WordPress has its own Certificate and listener so a
# missing wordpress record cannot stall that renewal.
#
# Change the ACME email before applying. If a letsencrypt-prod ClusterIssuer
# already exists, keep one copy and use the same email.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@local.my.id
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: public
                namespace: monitoring
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-tls
  namespace: monitoring
spec:
  secretName: public-tls
  dnsNames:
    - grafana.local.my.id
    - hubble.local.my.id
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
# A separate Certificate and listener keep WordPress out of the Grafana/Hubble
# certificate. A missing wordpress record then only blocks WordPress, instead of
# stalling the renewal of all three names at once.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wordpress-tls
  namespace: monitoring
spec:
  secretName: wordpress-tls
  dnsNames:
    - wordpress.local.my.id
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
# Hubble UI has no authentication of its own, so an nginx proxy in front of it
# asks for HTTP basic auth. Credentials only travel over the HTTPS listener; the
# HTTP listener redirects before any request reaches the proxy.
#
# The htpasswd below is the lab placeholder for user "admin" with password
# "changeme". Re-applying this file resets it, so replace the hash here or
# update the Secret out of band (see docs/observability.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-auth
  namespace: monitoring
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }

    server {
      listen 8080;
      auth_basic "Hubble";
      auth_basic_user_file /etc/nginx/auth/htpasswd;

      # Probes must not require credentials.
      location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
      }

      location / {
        proxy_pass http://hubble-ui.kube-system.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Flow streaming keeps responses open; do not buffer or time out early.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: hubble-auth
  namespace: monitoring
type: Opaque
stringData:
  # admin / changeme
  htpasswd: admin:$apr1$.VCEytz4$Z0kVliecuxK9XC8MYJBiA/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubble-auth
  namespace: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hubble-auth
  template:
    metadata:
      labels:
        app: hubble-auth
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hubble-auth
        - name: auth
          secret:
            secretName: hubble-auth
---
apiVersion: v1
kind: Service
metadata:
  name: hubble-auth
  namespace: monitoring
spec:
  selector:
    app: hubble-auth
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Listeners carry no hostname, so the routes below can match any name.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: monitoring
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: public-tls
    # Cilium separates the two HTTPS listeners by SNI, so WordPress gets its own
    # certificate without touching the Grafana/Hubble one. The Selector pins the
    # listener to the wordpress namespace using the label the API server sets on
    # every namespace; `from: Same` would refuse routes outside monitoring.
    - name: wordpress-http
      hostname: wordpress.local.my.id
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [wordpress, monitoring]
    - name: wordpress-https
      hostname: wordpress.local.my.id
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: wordpress
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wordpress-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - grafana.local.my.id
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-redirect
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames:
    - grafana.local.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - hubble.local.my.id
  rules:
    - backendRefs:
        - name: hubble-auth
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-redirect
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames:
    - hubble.local.my.id
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
